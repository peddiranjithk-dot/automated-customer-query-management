{% extends "base.html" %}
{% block title %}Submit Query{% endblock %}
{% block content %}
<div class="card">
  <h1>Submit a Query</h1>
  <form method="post">
    <label for="name">Your Name</label>
    <input id="name" name="name" value="{{ form.get('name','') }}" required>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ form.get('email','') }}" required>
    <label for="subject">Subject</label>
    <input id="subject" name="subject" value="{{ form.get('subject','') }}" required>
    <label for="message">Describe your query</label>
    <textarea id="message" name="message" required>{{ form.get('message','') }}</textarea>
    <button type="submit">Submit</button>
  </form>
</div>
{% endblock %}
